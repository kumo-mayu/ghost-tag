<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ghost-tag</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="screen-setup" class="screen">
  <h1>ghost-tag<span class="subtitle">一人鬼ごっこ</span></h1>
  <p class="warn">安全を確認した広い屋外（河川敷・空き地等）で、周囲に注意して開始してください。走行中は画面を見ずに音を頼りにしてください。</p>

  <form id="config-form">
    <label>プレイエリア半径 (m)
      <input type="number" name="playAreaRadius" value="300" min="30" step="10" required>
    </label>
    <label>鬼の初期出現距離 (m)
      <input type="number" name="oniInitialDistance" value="150" min="10" step="10" required>
    </label>
    <label>鬼の移動速度 (m/s)
      <input type="number" name="oniSpeed" value="2.0" min="0.1" step="0.1" required>
    </label>
    <label>捕獲判定距離 (m)
      <input type="number" name="captureDistance" value="15" min="3" step="1" required>
    </label>

    <label class="checkbox">
      <input type="checkbox" name="enableHighAccuracy" checked>
      GPS高精度モード（バッテリー消費増）
    </label>
    <label class="checkbox">
      <input type="checkbox" name="areaExitGameOver">
      エリア外に出たら即ゲームオーバー（未チェック時は警告のみ）
    </label>

    <details>
      <summary>詳細設定</summary>
      <label>鬼AI更新間隔 (ms)
        <input type="number" name="oniTickMs" value="500" min="100" step="100">
      </label>
      <label>GPSロスト判定 (ms)
        <input type="number" name="gpsLostTimeoutMs" value="10000" min="3000" step="1000">
      </label>
      <label>音: 最短間隔 ms（捕獲距離時）
        <input type="number" name="audioMinIntervalMs" value="150" min="50" step="10">
      </label>
      <label>音: 最長間隔 ms（遠距離時）
        <input type="number" name="audioMaxIntervalMs" value="2000" min="200" step="100">
      </label>
      <label>音: 遠距離とみなす距離 (m)
        <input type="number" name="audioFarDistance" value="150" min="20" step="10">
      </label>
    </details>

    <button type="submit" id="start-btn" class="big-button">START</button>
  </form>
  <p id="setup-error" class="error" hidden></p>
</div>

<div id="screen-running" class="screen" hidden>
  <div class="status-line">
    <span id="running-status">RUNNING</span>
    <span id="running-timer">00:00</span>
  </div>

  <div id="area-warning" class="banner warning" hidden>⚠ プレイエリア外です</div>
  <div id="gps-warning" class="banner warning" hidden>⚠ GPS信号ロスト</div>

  <div class="gps-info">GPS精度: <span id="gps-accuracy">--</span> m</div>

  <button id="stop-btn" class="big-button stop">STOP</button>

  <button id="debug-toggle" class="link-button" type="button">デバッグ情報を表示</button>
  <div id="debug-panel" hidden>
    <pre id="debug-text"></pre>
    <label class="map-mode-label">地図表示
      <select id="map-mode">
        <option value="off">オフ</option>
        <option value="simple">シンプル（相対位置）</option>
        <option value="osm">地図タイル（OpenStreetMap）</option>
      </select>
    </label>
    <p id="map-error" class="error" hidden></p>
    <div id="map-container" hidden></div>
  </div>
</div>

<div id="screen-ended" class="screen" hidden>
  <h2 id="ended-title">GAME OVER</h2>
  <p id="ended-message"></p>
  <p>経過時間: <span id="ended-time">--</span></p>
  <button id="restart-btn" class="big-button">もう一度</button>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
